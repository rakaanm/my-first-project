<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>غرف صوتية</title><style>body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}.room{background:#222;padding:20px;border-radius:12px;width:200px;cursor:pointer;display:inline-block;margin:10px;border:1px solid #333}button{padding:10px 20px;background:#6c5ce7;color:#fff;border:none;border-radius:8px}input{padding:10px;border-radius:8px;border:none;width:200px}#controls{display:none;margin-top:20px}.user{margin:5px;background:#2d3436;padding:8px;border-radius:6px}</style></head><body><h1>🎤 غرف الدردشة</h1><input id="roomName" placeholder="اسم الغرفة"><button onclick="joinExisting(document.getElementById('roomName').value)">دخول</button><div id="controls"><h2 id="currentRoom"></h2><button id="muteBtn" onclick="toggleMute()">كتم</button><button onclick="leaveRoom()" style="background:#d63031">خروج</button><div id="users"></div></div><div style="margin-top:30px"><div class="room" onclick="joinExisting('العامة')">🔊 العامة</div><div class="room" onclick="joinExisting('سوالف')">💬 سوالف</div><div class="room" onclick="joinExisting('العاب')">🎮 العاب</div></div><script>let localStream,isMuted=false;async function joinExisting(name){if(!name)return alert('اكتب اسم الغرفة');document.getElementById('currentRoom').innerText='غرفة: '+name;document.getElementById('controls').style.display='block';try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});let d=document.createElement('div');d.className='user';d.innerText='🎤 انت';document.getElementById('users').appendChild(d);}catch(e){alert('اسمح للمايك');}}function toggleMute(){if(!localStream)return;isMuted=!isMuted;localStream.getAudioTracks()[0].enabled=!isMuted;document.getElementById('muteBtn').innerText=isMuted?'فتح المايك':'كتم';}function leaveRoom(){document.getElementById('controls').style.display='none';document.getElementById('users').innerHTML='';if(localStream)localStream.getTracks().forEach(t=>t.stop());}</script></body></html>
